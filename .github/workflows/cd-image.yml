name: Server Image

# Builds the server's image on every push to main, pushes schmeide.azurecr.io/schmeide-app:<sha>, and
# commits that tag to schmeide/iac, where Argo CD rolls it out. Needs these repository secrets:
# - AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID: the push identity (schmeide/iac#23)
# - IAC_DEPLOY_KEY: an SSH deploy key with write access to schmeide/iac
# Until AZURE_CLIENT_ID is set, it only builds the image. Without IAC_DEPLOY_KEY (org policy disables
# deploy keys on schmeide/iac for now), it pushes and the job summary says which tag to bump by hand.

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

# One deploy at a time, in push order, so two tag commits never race.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'schmeide/schmeide.app' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: schmeide.azurecr.io/schmeide-app:${{ github.sha }}
      # `secrets` cannot be read in `if:`; these env values can.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      IAC_DEPLOY_KEY: ${{ secrets.IAC_DEPLOY_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build image
        run: make image IMAGE="$IMAGE"

      - name: Log in to Azure
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push image
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        run: |
          az acr login --name schmeide
          docker push "$IMAGE"

      - name: Note the manual tag bump
        if: ${{ env.AZURE_CLIENT_ID != '' && env.IAC_DEPLOY_KEY == '' }}
        run: |
          {
            echo "Pushed \`$IMAGE\`."
            echo
            echo "No IAC_DEPLOY_KEY secret, so the tag was not bumped: set \`newTag: \"$GITHUB_SHA\"\` in schmeide/iac \`gitops/schmeide/schmeide-app/kustomization.yaml\` by hand until a deploy key or GitHub App is allowed there."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout schmeide/iac
        if: ${{ env.AZURE_CLIENT_ID != '' && env.IAC_DEPLOY_KEY != '' }}
        uses: actions/checkout@v7
        with:
          repository: schmeide/iac
          ssh-key: ${{ secrets.IAC_DEPLOY_KEY }}
          path: iac

      # Fast-forward only: on a rejected push, start again from the new iac main and redo the edit.
      - name: Deploy the tag
        if: ${{ env.AZURE_CLIENT_ID != '' && env.IAC_DEPLOY_KEY != '' }}
        working-directory: iac
        env:
          SHA: ${{ github.sha }}
        run: |
          file=gitops/schmeide/schmeide-app/kustomization.yaml
          git config user.name "schmeide-deploy[bot]"
          git config user.email "schmeide-deploy[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            sed -i -E "/name: schmeide-app/,/newTag:/ s/(newTag:).*/\1 \"$SHA\"/" "$file" || true
            if ! grep -qs "newTag: \"$SHA\"" "$file"; then
              echo "Error: $file needs an images entry with name: schmeide-app and a newTag line (schmeide/iac#25). Add it, then re-run this workflow."
              exit 1
            fi
            if git diff --quiet; then
              echo "$file already deploys $SHA."
              exit 0
            fi
            git commit -s -am "chore(deploy): schmeide-app ${SHA::7}"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "schmeide/iac main moved; retrying ($attempt)."
            sleep $((attempt * 2))
          done
          echo "Error: could not push to schmeide/iac main after 5 attempts. Re-run this workflow."
          exit 1
